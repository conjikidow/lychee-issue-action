name: Bump Version

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

permissions: {}

jobs:

  bump-version:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Bump version
        uses: conjikidow/bump-version-action@d5a2fbdb850a48d6cc4b3dab12a18738dccb7d63 # v4.0.3
        with:
          label-major: 'update::major'
          label-minor: 'update::minor'
          label-patch: 'update::patch'
          manual-bump-type: ${{ inputs.bump_type }}
          labels-to-add: 'automated,versioning'
          create-release: 'true'
          github-token: ${{ steps.app-token.outputs.token }}
