name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  determine-changes:
    name: Determine changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      github-actions: ${{ steps.changed-files.outputs.github_actions_any_changed }}
      github-actions-ci: ${{ steps.changed-files.outputs.github_actions_ci_any_changed }}
      pre-commit-config: ${{ steps.changed-files.outputs.pre_commit_config_any_changed }}
      renovate-config: ${{ steps.changed-files.outputs.renovate_config_any_changed }}
      md: ${{ steps.changed-files.outputs.md_any_changed }}
      json5: ${{ steps.changed-files.outputs.json5_any_changed }}
      json5-files: ${{ steps.changed-files.outputs.json5_all_changed_files }}
      toml: ${{ steps.changed-files.outputs.toml_any_changed }}
      yaml: ${{ steps.changed-files.outputs.yaml_any_changed }}
      shell: ${{ steps.changed-files.outputs.shell_any_changed }}

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          safe_output: false
          separator: "\n"
          files_yaml: |
            github_actions:
              - '.github/workflows/**'
              - 'action.yaml'
            github_actions_ci:
              - '.github/workflows/ci.yaml'
            pre_commit_config:
              - '.pre-commit-config.yaml'
            renovate_config:
              - '.github/renovate.json5'
            md:
              - '**/*.md'
              - '.rumdl.toml'
            json5:
              - '**/*.json5'
            toml:
              - '**/*.toml'
            yaml:
              - '**/*.yml'
              - '**/*.yaml'
              - '.yamllint.yaml'
            shell:
              - '**/*.sh'

  lint-github-actions:
    name: Lint GitHub Actions
    needs: determine-changes
    if: needs.determine-changes.outputs.github-actions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint GitHub Actions
        if: github.event_name != 'pull_request'
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

      - name: Lint GitHub Actions (reviewdog)
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-actionlint@8b682e1e7e512151d73a6b9449cbff173846226e # v1.74.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: nofilter
          fail_level: error

  audit-zizmor:
    name: Audit with zizmor
    needs: determine-changes
    if: >-
      needs.determine-changes.outputs.github-actions == 'true'
      || needs.determine-changes.outputs.pre-commit-config == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit with zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 'v1.30.1'
          advanced-security: false
          annotations: true

      - name: Audit with zizmor (SARIF upload)
        if: >-
          always()
          && github.event.repository.private == false
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 'v1.30.1'
          advanced-security: true

  validate-renovate-config:
    name: Validate Renovate config
    needs: determine-changes
    if: >-
      needs.determine-changes.outputs.renovate-config == 'true'
      || needs.determine-changes.outputs.github-actions-ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Validate Renovate config
        run: npx --yes --package renovate@44.132.2 renovate-config-validator .github/renovate.json5

  lint-markdown:
    name: Lint Markdown
    needs: determine-changes
    if: >-
      needs.determine-changes.outputs.md == 'true'
      || needs.determine-changes.outputs.github-actions-ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: rvben/rumdl@9c4cc2a2ebe176de68e1788106e25af8a9bd3899 # v0.2.78
        with:
          version: '0.2.78'
          report-type: annotations

  validate-json5:
    name: Validate JSON5
    needs: determine-changes
    if: >-
      needs.determine-changes.outputs.json5 == 'true'
      || needs.determine-changes.outputs.github-actions-ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate JSON5
        env:
          CHANGED_JSON5_FILES: ${{ needs.determine-changes.outputs.json5-files }}
        run: |
          readarray -t json5_files < <(
            printf '%s\n' "${CHANGED_JSON5_FILES}" | sed '/^$/d'
          )
          if [ ${#json5_files[@]} -eq 0 ]; then
            readarray -d '' -t json5_files < <(
              find . -type f -name '*.json5' -not -path './.git/*' -print0
            )
          fi
          if [ ${#json5_files[@]} -eq 0 ]; then
            echo 'No JSON5 files found.'
            exit 0
          fi
          exit_code=0
          for json5_file in "${json5_files[@]}"; do
            npx --yes json5@2.2.3 --validate "${json5_file}" || exit_code=1
          done
          exit ${exit_code}

  lint-toml:
    name: Lint TOML
    needs: determine-changes
    if: >-
      needs.determine-changes.outputs.toml == 'true'
      || needs.determine-changes.outputs.github-actions-ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tombi
        uses: tombi-toml/setup-tombi@adc72e7b9a4c5fc8beac71a944c0cc52edbe06f5 # v1.6.1
        with:
          version: '1.6.1'

      - name: Lint TOML
        if: github.event_name != 'pull_request'
        run: tombi lint

      - name: Install reviewdog
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: 'v0.21.2'

      - name: Lint TOML (reviewdog)
        if: github.event_name == 'pull_request'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_COLOR: 1
        run: |
          lint_rc=0
          tombi lint --quiet > /tmp/tombi-lint-report.txt 2>&1 || lint_rc=$?
          gawk '
            match($0, /^[[:space:]]*(Warning|Error):[[:space:]]*(.*)$/, m) {
              severity = m[1]; message = m[2]; next
            }
            match($0, /^[[:space:]]*at[[:space:]]+(.*):([0-9]+):([0-9]+)/, m) {
              printf "%s:%s:%s: %s: %s\n", m[1], m[2], m[3], substr(severity, 1, 1), message
            }
          ' /tmp/tombi-lint-report.txt > /tmp/tombi-lint-report.efm.txt
          reviewdog_rc=0
          reviewdog < /tmp/tombi-lint-report.efm.txt \
              -efm="%f:%l:%c: %t: %m" \
              -name=tombi-lint \
              -reporter=github-pr-review \
              -filter-mode=nofilter \
              -fail-level=error || reviewdog_rc=$?
          if [ ${lint_rc} -ne 0 ] && [ ! -s /tmp/tombi-lint-report.efm.txt ]; then
            echo "::error title=tombi::tombi lint failed before producing parseable diagnostics"
            cat /tmp/tombi-lint-report.txt
            exit ${lint_rc}
          fi
          exit ${reviewdog_rc}

      - name: Format TOML
        run: tombi format

      - name: Suggest TOML formatting
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-suggester@c387862ad6765a9729f2b40ee4d8b5769f2145c7 # v1.26.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tool_name: tombi-format
          cleanup: false

      - name: Check TOML formatting
        run: git diff --exit-code

  lint-yaml:
    name: Lint YAML
    needs: determine-changes
    if: >-
      needs.determine-changes.outputs.yaml == 'true'
      || needs.determine-changes.outputs.github-actions-ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        if: github.event_name != 'pull_request'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.22'

      - name: Lint YAML
        if: github.event_name != 'pull_request'
        run: uvx --from "yamllint==1.38.0" yamllint .

      - name: Lint YAML (reviewdog)
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-yamllint@5dd4640db975e4cac6f4e775a401695bafc28068 # v1.25.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: nofilter
          fail_level: error
          yamllint_flags: .

  lint-shell-scripts:
    name: Lint shell scripts
    needs: determine-changes
    if: >-
      needs.determine-changes.outputs.shell == 'true'
      || needs.determine-changes.outputs.github-actions-ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shell tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shfmt
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            sudo apt-get install -y shellcheck
          fi

      - name: Collect shell scripts
        id: shell-scripts
        run: |
          shell_files_path="$(mktemp)"
          find . -type f -name '*.sh' -not -path './.git/*' -print0 > "${shell_files_path}"
          echo "files=${shell_files_path}" >> "${GITHUB_OUTPUT}"
          if [ ! -s "${shell_files_path}" ]; then
            echo "No shell scripts found."
            echo "found=false" >> "${GITHUB_OUTPUT}"
          else
            echo "found=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check shell script formatting
        if: steps.shell-scripts.outputs.found == 'true'
        env:
          SHELL_FILES: ${{ steps.shell-scripts.outputs.files }}
        run: xargs -0 shfmt --diff --simplify -i 2 < "${SHELL_FILES}"

      - name: Lint shell scripts
        if: >-
          github.event_name != 'pull_request'
          && steps.shell-scripts.outputs.found == 'true'
        env:
          SHELL_FILES: ${{ steps.shell-scripts.outputs.files }}
        run: xargs -0 shellcheck --external-sources < "${SHELL_FILES}"

      - name: Lint shell scripts (reviewdog)
        if: >-
          github.event_name == 'pull_request'
          && steps.shell-scripts.outputs.found == 'true'
        uses: reviewdog/action-shellcheck@d0b8d5fd7fad6afdb6e1b6ce1778892be4d1f427 # v1.34.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: nofilter
          fail_level: error

  run-prek-hooks:
    name: Run prek hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run prek hooks
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: 'v0.5.4'
          extra-args: --all-files --skip no-commit-to-branch

  check-spelling:
    name: Check spelling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check spelling
        if: github.event_name != 'pull_request'
        uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3

      - name: Check spelling (reviewdog)
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-typos@d5eb1bbcd1b3bfde596f6eeb470322727862fe98 # v1.19.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: nofilter
          fail_level: error
          typos_flags: .

  lint-commit-messages:
    name: Lint commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Commitizen
        uses: commitizen-tools/setup-cz@96c75e6ae9632047f2c9b4025b9dd1624b40de8f # v0.9.1
        with:
          python-version: '3.x'
          version: '4.19.0'

      - name: Lint commit messages (push)
        if: github.event_name == 'push'
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if ! git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "::notice title=cz check::Base commit unavailable (new branch or force push); skipping lint."
            exit 0
          fi
          cz check --rev-range "${PUSH_BEFORE_SHA}..${GITHUB_SHA}"

      - name: Lint commit messages (pull request)
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: cz check --rev-range "${PR_BASE_SHA}..${PR_HEAD_SHA}"
