name: Bump version

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:
    inputs:
      bump-type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

permissions: {}

jobs:
  bump-version:
    name: Bump version
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Bump version
        uses: conjikidow/bump-version-action@6d1c904854b8537c080371c2e28094931fd46a1b # v4.3.1
        with:
          label-major: update::major
          label-minor: update::minor
          label-patch: update::patch
          manual-bump-type: ${{ inputs.bump-type }}
          labels-to-add: automated,release
          create-release: true
          github-token: ${{ steps.app-token.outputs.token }}
