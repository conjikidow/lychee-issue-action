name: Lychee Issue Action
description: 'Track the broken links found by lychee as GitHub issues'
author: conjikidow

branding:
  icon: link
  color: red

inputs:
  report:
    description: 'Path to the report lychee wrote with `--format json`.'
    required: false
    default: lychee/out.json
  label:
    description: 'Label carried by every issue the action opens, and the key it looks them up by.'
    required: false
    default: links
  extra-labels:
    description: 'Further labels to apply on creation, separated by commas. Not used for lookup.'
    required: false
    default: ''
  title-prefix:
    description: 'Text placed before the link in the issue title.'
    required: false
    default: 'docs: fix broken link'
  github-token:
    description: 'Token used to authenticate with GitHub. Needs `issues: write`.'
    required: false
    default: ${{ github.token }}

outputs:
  broken:
    description: 'Number of unreachable links in the report.'
    value: ${{ steps.collect-broken-links.outputs.broken }}
  opened:
    description: 'Number of issues opened by this run.'
    value: ${{ steps.open-issues.outputs.opened }}
  closed:
    description: 'Number of issues closed by this run.'
    value: ${{ steps.close-issues.outputs.closed }}

runs:
  using: composite

  steps:
    - name: Validate inputs
      id: validate-inputs
      shell: bash
      env:
        REPORT: ${{ inputs.report }}
        LABEL: ${{ inputs.label }}
      run: bash "${GITHUB_ACTION_PATH}/src/validate-inputs.sh"

    - name: Collect broken links
      id: collect-broken-links
      shell: bash
      env:
        REPORT: ${{ inputs.report }}
      run: bash "${GITHUB_ACTION_PATH}/src/collect-broken-links.sh"

    - name: List the reported issues
      id: list-reported-issues
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        NORMALIZED_LABEL: ${{ steps.validate-inputs.outputs.label }}
      run: bash "${GITHUB_ACTION_PATH}/src/list-reported-issues.sh"

    - name: Create the missing labels
      if: steps.collect-broken-links.outputs.broken != '0'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        EXTRA_LABELS: ${{ inputs.extra-labels }}
        NORMALIZED_LABEL: ${{ steps.validate-inputs.outputs.label }}
      run: bash "${GITHUB_ACTION_PATH}/src/create-missing-labels.sh"

    - name: Open issues for the newly broken links
      id: open-issues
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        EXTRA_LABELS: ${{ inputs.extra-labels }}
        TITLE_PREFIX: ${{ inputs.title-prefix }}
        NORMALIZED_LABEL: ${{ steps.validate-inputs.outputs.label }}
        RECORDS: ${{ steps.collect-broken-links.outputs.records }}
        REPORTED: ${{ steps.list-reported-issues.outputs.reported }}
      run: bash "${GITHUB_ACTION_PATH}/src/open-issues.sh"

    - name: Close the issues whose links recovered
      id: close-issues
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        RECORDS: ${{ steps.collect-broken-links.outputs.records }}
        REPORTED: ${{ steps.list-reported-issues.outputs.reported }}
      run: bash "${GITHUB_ACTION_PATH}/src/close-issues.sh"
